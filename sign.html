<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Sign release</title>
<style>
:root { --bg:#fff; --fg:#111; --mut:#555; --ok:#0a6b2b; --bad:#a40000; --btn:#0b57d0; }
@media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --mut:#aaa; --ok:#5fd38a; --bad:#ff7b7b; --btn:#7fb0ff; } }
body { background:var(--bg); color:var(--fg); font:18px/1.45 system-ui, sans-serif; margin:0; padding:16px; }
h1 { font-size:22px; margin:0 0 12px; }
.k { color:var(--mut); font-size:14px; } .v { font-family:monospace; word-break:break-all; margin-bottom:10px; }
button { font-size:20px; width:100%; padding:16px; margin:10px 0; border:0; border-radius:12px; background:var(--btn); color:var(--bg); }
button[disabled] { opacity:.4; } button.alt { font-size:16px; padding:10px; background:var(--mut); } #msg { margin-top:12px; } .ok { color:var(--ok); } .bad { color:var(--bad); }
textarea { width:100%; height:6em; font-size:12px; }
</style>
</head>
<body>
<h1 id="h">Sign release</h1>
<div class="k" id="k1">Release</div><div class="v" id="rel">-</div>
<div class="k" id="k2">Commit</div><div class="v" id="sha">-</div>
<div class="k">What it does</div><div class="v" id="title">-</div>
<div class="k">Good until</div><div class="v" id="exp">-</div>
<button id="go" disabled>Sign with fingerprint</button>
<button id="send" hidden>Send to the bot</button>
<button id="copy" class="alt" hidden>Copy the message</button>
<button id="share" class="alt" hidden>Other way: pick the bot from Telegram's list</button>
<div id="msg"></div>
<textarea id="out" hidden readonly></textarea>
<script id="lib">
/* Pure helpers (also run by the offline harness under node). The page holds no secret and no authority: the Dell's
   admin verifier recomputes the challenge from its own files; whatever this page shows, only a tap over the exact
   challenge the Dell asked for is accepted. */
var COS = (function () {
  function b64uToBytes(s) {
    if (!/^[A-Za-z0-9_-]*$/.test(s)) throw new Error("bad base64url");
    s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
    var bin = atob(s), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  function bytesToB64u(buf) {
    var u = new Uint8Array(buf), s = "";
    for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  /* Fragment: #v1.<b64u(JSON {rel,sha,pack,wf,proof,installed,title,expires,nonce,rpId,challenge,cred})> (never sent
     to any server).
     Install links add kind "install": {kind,name,bundle,what,nonce,expires,rpId,challenge,cred}. */
  function parseFragment(frag) {
    var m = /^#v1\.([A-Za-z0-9_-]{20,6000})$/.exec(frag || "");
    if (!m) throw new Error("this link is not a sign link");
    var o = JSON.parse(new TextDecoder().decode(b64uToBytes(m[1])));
    var hex40 = /^[0-9a-f]{40}$/, hex32 = /^[0-9a-f]{32}$/, b = /^[A-Za-z0-9_-]{16,700}$/;
    if (o === null || typeof o !== "object") throw new Error("this sign link has a bad value");
    if ("kind" in o) {
      if (o.kind !== "install" || !/^[a-z0-9][a-z0-9-]{0,39}$/.test(o.name) || !/^[0-9a-f]{64}$/.test(o.bundle)
          || typeof o.what !== "string" || !/^[\x20-\x7e\n]{1,900}$/.test(o.what) || !/\S/.test(o.what)
          || !hex32.test(o.nonce) || !Number.isInteger(o.expires) || !/^[A-Za-z0-9.-]{3,253}$/.test(o.rpId)
          || !/^[A-Za-z0-9_-]{43}$/.test(o.challenge) || !b.test(o.cred))
        throw new Error("this install link has a bad value");
      return o;
    }
    if (m[1].length > 3000) throw new Error("this link is not a sign link");   /* releases: as before */
    if (!/^7\.[0-9]{1,2}(\.[0-9]{1,2})?$/.test(o.rel) || !hex40.test(o.sha) || !hex32.test(o.nonce)
        || !hex40.test(o.pack) || !hex40.test(o.wf) || !/^[0-9a-f]{64}$/.test(o.proof) || !hex40.test(o.installed)
        || !Number.isInteger(o.expires) || !/^[A-Za-z0-9.-]{3,253}$/.test(o.rpId)
        || !/^[A-Za-z0-9_-]{43}$/.test(o.challenge) || !b.test(o.cred) || typeof o.title !== "string")
      throw new Error("this sign link has a bad value");
    return o;
  }
  function hex(buf) {
    var u = new Uint8Array(buf), s = "";
    for (var i = 0; i < u.length; i++) s += (u[i] < 16 ? "0" : "") + u[i].toString(16);
    return s;
  }
  /* What he reads is what he signs: for an install link the page itself recomputes the challenge from exactly the
     fields it shows (sha256("cos-install-v1|NAME|BUNDLE|sha256(WHAT)|NONCE|EXPIRES"), the Dell's formula) and refuses
     the link if it is not the challenge the link asks the passkey to sign. Release links the same (Nov 21 2026):
     sha256("cos-sign-v1|REL|SHA|PACK|WF|PROOF|INSTALLED|NONCE|EXPIRES"); a link without those fields is refused. */
  function ready(o, subtle) {
    if (!subtle) return Promise.reject(new Error("this browser cannot check the link; open it in Chrome"));
    var te = new TextEncoder();
    if (o.kind !== "install") {
      var rs = ["cos-sign-v1", o.rel, o.sha, o.pack, o.wf, o.proof, o.installed, o.nonce, String(o.expires)].join("|");
      return subtle.digest("SHA-256", te.encode(rs)).then(function (c) {
        if (bytesToB64u(c) !== o.challenge) throw new Error("this link does not match what it shows; nothing was signed");
        return o;
      });
    }
    return subtle.digest("SHA-256", te.encode(o.what)).then(function (w) {
      var s = ["cos-install-v1", o.name, o.bundle, hex(w), o.nonce, String(o.expires)].join("|");
      return subtle.digest("SHA-256", te.encode(s));
    }).then(function (c) {
      if (bytesToB64u(c) !== o.challenge) throw new Error("this link does not match what it shows; nothing was approved");
      return o;
    });
  }
  /* the short bundle fingerprint he can compare with the Dell's lines: first 12 hex in groups of 4 */
  function shortFp(h) { return h.slice(0, 4) + " " + h.slice(4, 8) + " " + h.slice(8, 12); }
  function getOptions(o) {
    return { publicKey: { challenge: b64uToBytes(o.challenge), rpId: o.rpId, timeout: 120000,
      userVerification: "required", allowCredentials: [{ type: "public-key", id: b64uToBytes(o.cred) }] } };
  }
  /* The tap as py_webauthn reads it (the browser's toJSON() shape). */
  function assertionJSON(c) {
    var r = c.response;
    return { id: c.id, rawId: bytesToB64u(c.rawId), type: c.type,
      response: { clientDataJSON: bytesToB64u(r.clientDataJSON), authenticatorData: bytesToB64u(r.authenticatorData),
        signature: bytesToB64u(r.signature), userHandle: r.userHandle ? bytesToB64u(r.userHandle) : null } };
  }
  /* One Telegram message to the bot: COSSIGN v1 <nonce> <b64u(JSON)>. Under 4096 characters. */
  function message(nonce, c) {
    var m = "COSSIGN v1 " + nonce + " " + bytesToB64u(new TextEncoder().encode(JSON.stringify(assertionJSON(c))));
    if (m.length > 3900) throw new Error("the tap is too long for one message");
    return m;
  }
  /* His bot's chat with the message filled in: tg://resolve?domain=<username>&text=<draft> (core.telegram.org/api/links).
     Not https://t.me/...: Telegram for Android does not verify-claim t.me (no autoVerify in its manifest), so on Android
     12+ Chrome shows the t.me web page instead of the app. The tg: scheme always goes straight to the app. */
  var BOT = "cos_brains_corey_bot";
  function botLink(m) { return "tg://resolve?domain=" + BOT + "&text=" + encodeURIComponent(m); }
  function shareLink(m) { return "tg://msg_url?url=" + encodeURIComponent(m); }
  return { botLink: botLink, shareLink: shareLink, b64uToBytes: b64uToBytes, bytesToB64u: bytesToB64u,
           parseFragment: parseFragment, ready: ready, shortFp: shortFp, getOptions: getOptions,
           assertionJSON: assertionJSON, message: message };
})();
if (typeof module !== "undefined") module.exports = COS;
</script>
<script>
(function () {
  if (typeof document === "undefined") return;
  var $ = function (id) { return document.getElementById(id); };
  function say(t, cls) { $("msg").textContent = t; $("msg").className = cls || ""; }
  var o;
  try { o = COS.parseFragment(location.hash); } catch (e) { say(e.message, "bad"); return; }
  var inst = o.kind === "install";
  if (inst) {                         /* an install: its name, the bundle's fingerprint and the whole WHAT list */
    document.title = "Approve install";
    $("h").textContent = "Approve install " + o.name;
    $("k1").textContent = "Install"; $("rel").textContent = o.name;
    $("k2").textContent = "Bundle fingerprint"; $("sha").textContent = COS.shortFp(o.bundle);
    $("title").textContent = o.what; $("title").style.whiteSpace = "pre-wrap";
    $("title").style.fontFamily = "inherit"; $("title").style.wordBreak = "normal";
    $("go").textContent = "Approve with fingerprint";
  } else {
    $("h").textContent = "Sign release " + o.rel;
    $("rel").textContent = o.rel; $("sha").textContent = o.sha;
    $("title").textContent = "review pack " + o.pack.slice(0, 12);     /* signed too; the link's free title is not */
  }
  $("exp").textContent = new Date(o.expires * 1000).toLocaleString();
  if (!window.PublicKeyCredential) { say("This browser cannot use passkeys. Open the link in Chrome.", "bad"); return; }
  if (Date.now() / 1000 > o.expires) { say("This sign link has expired. Nothing was signed.", "bad"); return; }
  COS.ready(o, window.crypto && window.crypto.subtle).then(function () { $("go").disabled = false; },
    function (e) { say(e.message, "bad"); });
  $("go").onclick = function () {
    $("go").disabled = true; say("Waiting for your fingerprint...");
    navigator.credentials.get(COS.getOptions(o)).then(function (c) {
      var m = COS.message(o.nonce, c);
      $("out").value = m; $("out").hidden = false; $("send").hidden = false;
      $("copy").hidden = false; $("share").hidden = false;
      say("Fingerprint done. NOT SENT YET. Tap Send to the bot: Telegram opens the cos brains chat with the message "
          + "in the box, and it is copied too. Tap Telegram's send arrow. The bot answers within a minute. No answer "
          + "means it did not arrive. " + (inst ? "The install runs on the Dell." : "Signing happens on the Dell."), "ok");
      function copy() {                                 /* on his clipboard too: if Telegram leaves the box empty, he pastes */
        var ok = false;
        try { $("out").focus(); $("out").select(); ok = document.execCommand("copy"); $("out").blur(); } catch (e) {}
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(m).catch(function () {});
        return ok;
      }
      $("send").onclick = function () {                 /* the bot's own chat, text filled in */
        copy();
        say("Opening Telegram. NOT SENT until you tap its send arrow. If the box there is empty: press and hold it, "
            + "tap Paste, then send. Then wait for the bot's answer.", "ok");
        location.href = COS.botLink(m);
      };
      $("copy").onclick = function () {
        say(copy() ? "Copied. Open the cos brains chat in Telegram, press and hold the box, tap Paste, then send."
                   : "Copy did not work here: press and hold the text below, Select all, Copy, then paste it in the cos brains chat.", "ok");
      };
      $("share").onclick = function () {                /* fallback: Telegram's chat list; pick the cos brains bot */
        copy();
        say("In Telegram's list pick the cos brains bot, then send. Wait for the bot's answer.", "ok");
        location.href = COS.shareLink(m);
      };
    }).catch(function (e) { $("go").disabled = false; say("Not signed: " + (e && e.name || "error") + ". Nothing was signed.", "bad"); });
  };
})();
</script>
</body>
</html>
